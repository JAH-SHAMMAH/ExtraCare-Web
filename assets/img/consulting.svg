<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t"><title id="t">Four consulting steps: you share your records such as sales, fees, stock and customers; we analyse what works and what does not; we suggest clear steps to run better and sell more; then you grow, and we track the results with you. For schools, businesses, hospitals and farms.</title><rect x="0" y="0" width="960" height="440" rx="28" fill="#0d2a20" /><rect x="40" y="70" width="200" height="250" rx="18" fill="#f4f0e6" /><circle cx="84" cy="118" r="24" fill="#0b5a3a"/><text x="84" y="127" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#f4f0e6" text-anchor="middle">1</text><text x="64" y="190" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1d2b25" text-anchor="start">Share</text><text x="64" y="232" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6b64" text-anchor="start">Sales, fees, stock</text><text x="64" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6b64" text-anchor="start">and customer records.</text><rect x="266" y="70" width="200" height="250" rx="18" fill="#f4f0e6" /><circle cx="310" cy="118" r="24" fill="#0b5a3a"/><text x="310" y="127" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#f4f0e6" text-anchor="middle">2</text><text x="290" y="190" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1d2b25" text-anchor="start">Analyse</text><text x="290" y="232" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6b64" text-anchor="start">We find what works</text><text x="290" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6b64" text-anchor="start">and what does not.</text><rect x="492" y="70" width="200" height="250" rx="18" fill="#f4f0e6" /><circle cx="536" cy="118" r="24" fill="#0b5a3a"/><text x="536" y="127" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#f4f0e6" text-anchor="middle">3</text><text x="516" y="190" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1d2b25" text-anchor="start">Suggest</text><text x="516" y="232" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6b64" text-anchor="start">Clear steps to run</text><text x="516" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6b64" text-anchor="start">better and sell more.</text><rect x="718" y="70" width="200" height="250" rx="18" fill="#0b5a3a" /><circle cx="762" cy="118" r="24" fill="#f4f0e6"/><text x="762" y="127" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#0b5a3a" text-anchor="middle">4</text><text x="742" y="190" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#f4f0e6" text-anchor="start">Grow</text><text x="742" y="232" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#cfe3d6" text-anchor="start">You act on it, and</text><text x="742" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#cfe3d6" text-anchor="start">we track the results.</text><path d="M244 195h16" stroke="#d8ff3e" stroke-width="4" stroke-linecap="round"/><path d="M470 195h16" stroke="#d8ff3e" stroke-width="4" stroke-linecap="round"/><path d="M696 195h16" stroke="#d8ff3e" stroke-width="4" stroke-linecap="round"/><rect x="40" y="350" width="880" height="50" rx="25.0" fill="#123629" stroke="rgba(244,240,230,.16)" stroke-width="2"/><text x="480" y="382.0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#f4f0e6" text-anchor="middle">For schools, businesses, hospitals and farms</text></svg>