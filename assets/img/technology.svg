<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t"><title id="t">The three layers of an ExtraCare system: Next.js and React screens on top, Python and FastAPI logic in the middle, PostgreSQL data at the base</title><rect x="0" y="0" width="960" height="440" rx="28" fill="#0d2a20" /><rect x="120" y="60" width="720" height="90" rx="20" fill="#d8ff3e" stroke="rgba(244,240,230,.16)" stroke-width="2"/><text x="156" y="104" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#071f17" text-anchor="start">Next.js and React</text><text x="156" y="132" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#071f17" text-anchor="start">The screens people use</text><rect x="150" y="170" width="660" height="90" rx="20" fill="#1c4535" stroke="rgba(244,240,230,.16)" stroke-width="2"/><text x="186" y="214" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#f4f0e6" text-anchor="start">Python and FastAPI</text><text x="186" y="242" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#b4c3b9" text-anchor="start">The rules and logic</text><rect x="180" y="280" width="600" height="90" rx="20" fill="#123629" stroke="rgba(244,240,230,.16)" stroke-width="2"/><text x="216" y="324" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#f4f0e6" text-anchor="start">PostgreSQL</text><text x="216" y="352" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#b4c3b9" text-anchor="start">Where your data is kept safe</text><text x="480" y="420" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#b4c3b9" text-anchor="middle">Each layer can be upgraded without starting again</text></svg>