<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 806" role="img" aria-labelledby="t"><title id="t">Example poultry screens: a layer house of 1,200 birds at week 38 with 34 crates of eggs, an 85 percent laying rate, 6 bags of feed used and 1 death, then reminders for a Newcastle vaccination on Thursday, low feed stock and a paid order of 12 crates.</title><rect x="0" y="0" width="520" height="806" rx="28" fill="#0d2a20" /><g transform="translate(-25.0 -20)"><rect x="50" y="40" width="470" height="360" rx="18" fill="#f4f0e6" /><text x="78" y="84" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#1d2b25" text-anchor="start">House 2 · Layers</text><text x="78" y="112" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#5c6b64" text-anchor="start">1,200 birds · week 38 · today</text><rect x="78" y="136" width="198" height="96" rx="14" fill="#ffffff" stroke="#ddd6c6"/><text x="96" y="170" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#5c6b64" text-anchor="start">Eggs</text><text x="96" y="210" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#1d2b25" text-anchor="start">34 crates</text><rect x="294" y="136" width="198" height="96" rx="14" fill="#ffffff" stroke="#ddd6c6"/><text x="312" y="170" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#5c6b64" text-anchor="start">Laying rate</text><text x="312" y="210" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#1d2b25" text-anchor="start">85%</text><rect x="78" y="248" width="198" height="96" rx="14" fill="#ffffff" stroke="#ddd6c6"/><text x="96" y="282" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#5c6b64" text-anchor="start">Feed used</text><text x="96" y="322" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#1d2b25" text-anchor="start">6 bags</text><rect x="294" y="248" width="198" height="96" rx="14" fill="#ffffff" stroke="#ddd6c6"/><text x="312" y="282" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#5c6b64" text-anchor="start">Deaths</text><text x="312" y="322" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#1d2b25" text-anchor="start">1</text><text x="78" y="376" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#5c6b64" text-anchor="start">Feed per bird: about 125 g a day</text></g><path d="M260.0 394V426" stroke="#d8ff3e" stroke-width="4" stroke-linecap="round"/><path d="M250.0 424l10 14 10-14z" fill="#d8ff3e"/><g transform="translate(-500.0 396)"><rect x="600" y="50" width="320" height="340" rx="18" fill="#123629" stroke="rgba(244,240,230,.16)" stroke-width="2"/><text x="626" y="92" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#f4f0e6" text-anchor="start">Coming up</text><rect x="626" y="116" width="268" height="76" rx="14" fill="#184534" /><rect x="626" y="116" width="6" height="76" rx="3" fill="#d8ff3e"/><text x="648" y="148" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#f4f0e6" text-anchor="start">Vaccination · Thursday</text><text x="648" y="174" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#b4c3b9" text-anchor="start">House 1 broilers · Newcastle</text><rect x="626" y="204" width="268" height="76" rx="14" fill="#184534" /><rect x="626" y="204" width="6" height="76" rx="3" fill="#c98a12"/><text x="648" y="236" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#f4f0e6" text-anchor="start">Feed stock low</text><text x="648" y="262" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#b4c3b9" text-anchor="start">9 bags left · order more</text><rect x="626" y="292" width="268" height="76" rx="14" fill="#184534" /><rect x="626" y="292" width="6" height="76" rx="3" fil