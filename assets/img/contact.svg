<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t"><title id="t">A chat where a visitor asks ExtraCare for a school website and gets a reply promising a clear plan and price</title><rect x="0" y="0" width="960" height="450" rx="28" fill="#0d2a20" /><rect x="250" y="40" width="460" height="370" rx="36" fill="#0a1a14" stroke="#d8ff3e" stroke-width="3"/><rect x="266" y="56" width="428" height="338" rx="26" fill="#e9e4d8" /><rect x="266" y="56" width="428" height="56" rx="26" fill="#071f17" /><rect x="266" y="92" width="428" height="20" rx="0" fill="#071f17" /><circle cx="300" cy="86" r="16" fill="#d8ff3e"/><text x="300" y="92" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#071f17" text-anchor="middle">EC</text><text x="326" y="92" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#f4f0e6" text-anchor="start">ExtraCare</text><rect x="430" y="130" width="244" height="76" rx="16" fill="#d4f5c4" /><text x="446" y="160" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1d2b25" text-anchor="start">Hello, I need a</text><text x="446" y="186" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1d2b25" text-anchor="start">school website.</text><rect x="286" y="220" width="290" height="104" rx="16" fill="#ffffff" /><text x="302" y="250" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1d2b25" text-anchor="start">Great. A few quick</text><text x="302" y="276" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1d2b25" text-anchor="start">questions, then we send</text><text x="302" y="302" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1d2b25" text-anchor="start">a clear plan and price.</text><rect x="286" y="340" width="388" height="40" rx="20" fill="#ffffff" /><text x="306" y="366" font-family="Arial,Helvetica,sans-serif" 