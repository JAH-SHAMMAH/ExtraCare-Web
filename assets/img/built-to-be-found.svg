<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">How a page built for search shows up</title>
  <desc id="d">A search for a school management system in Abuja. The ExtraCare result sits at the top, and labels point out what makes it findable: a clear page title, a helpful description, a page that loads fast on a phone, and a sitemap that lists every page for search engines.</desc>
  <defs>
    <style>
      .q{font:400 17px Arial,Helvetica,sans-serif;fill:#1d2b25}
      .u{font:400 14px Arial,Helvetica,sans-serif;fill:#3d5a4d}
      .ti{font:700 21px Arial,Helvetica,sans-serif;fill:#0b5a3a}
      .ds{font:400 15px Arial,Helvetica,sans-serif;fill:#45524c}
      .lb{font:700 15px Arial,Helvetica,sans-serif;fill:#f4f0e6}
      .ls{font:400 13px Arial,Helvetica,sans-serif;fill:#b4c3b9}
      .ln{stroke:#d8ff3e;stroke-width:2.5;fill:none}
    </style>
  </defs>
  <rect width="960" height="560" rx="28" fill="#071f17"/>

  <!-- results page -->
  <rect x="40" y="40" width="580" height="480" rx="20" fill="#f4f0e6"/>
  <rect x="64" y="64" width="532" height="50" rx="25" fill="#ffffff" stroke="#d9d4c6" stroke-width="1.5"/>
  <circle cx="92" cy="89" r="8" fill="none" stroke="#3d5a4d" stroke-width="2.4"/><path d="M98 95l7 7" stroke="#3d5a4d" stroke-width="2.4" stroke-linecap="round"/>
  <text class="q" x="118" y="95">school management system Abuja</text>

  <!-- top result -->
  <rect x="58" y="134" width="544" height="150" rx="14" fill="#ffffff" stroke="#d8ff3e" stroke-width="3"/>
  <rect x="78" y="154" width="28" height="28" rx="8" fill="#071f17"/><text x="83" y="174" font-family="Arial" font-weight="700" font-size="14" fill="#d8ff3e">EC</text>
  <text class="u" x="116" y="165">ExtraCare</text>
  <text class="u" x="116" y="183">extracare.ng › school-system</text>
  <text class="ti" x="78" y="216">School management system | ExtraCare</text>
  <text class="ds" x="78" y="244">Report cards, CBT exams, attendance, fees, SMS and live</text>
  <text class="ds" x="78" y="264">classes in one system, built in Abuja.</text>

  <!-- other results (greyed) -->
  <g fill="#e2ddd0">
    <rect x="78" y="312" width="180" height="12" rx="6"/><rect x="78" y="334" width="380" height="18" rx="9"/><rect x="78" y="362" width="470" height="11" rx="5"/><rect x="78" y="381" width="320" height="11" rx="5"/>
    <rect x="78" y="418" width="160" height="12" rx="6"/><rect x="78" y="440" width="340" height="18" rx="9"/><rect x="78" y="468" width="450" height="11" rx="5"/>
  </g>

  <!-- annotations -->
  <path class="ln" d="M500 210 H660"/><circle cx="500" cy="210" r="5" fill="#d8ff3e"/>
  <text class="lb" x="672" y="200">A clear page title</text>
  <text class="ls" x="672" y="220">Says what you do and where</text>

  <path class="ln" d="M560 254 C610 254 610 290 660 290"/><circle cx="560" cy="254" r="5" fill="#d8ff3e"/>
  <text class="lb" x="672" y="282">A helpful description</text>
  <text class="ls" x="672" y="302">Gives people a reason to click</text>

  <!-- phone -->
  <g transform="translate(672 340)">
    <rect width="66" height="120" rx="12" fill="#0d2a20" stroke="#d8ff3e" stroke-width="2.5"/>
    <rect x="8" y="14" width="50" height="10" rx="4" fill="#d8ff3e"/>
    <rect x="8" y="32" width="50" height="6" rx="3" fill="#2c4a3d"/><rect x="8" y="44" width="36" height="6" rx="3" fill="#2c4a3d"/><rect x="8" y="62" width="50" height="40" rx="6" fill="#123629"/>
  </g>
  <text class="lb" x="752" y="370">Fast on a phone</text>
  <text class="ls" x="752" y="390">Most people search on one</text>

  <text class="lb" x="752" y="428">A sitemap</text>
  <text class="ls" x="752" y="448">Lists every page so search</text>
  <text class="ls" x="752" y="466">engines read them all</text>

  <text x="64" y="545" font-family="Arial" font-size="12" fill="#b4c3b9">Illustration of a search results page</text>
</svg>
