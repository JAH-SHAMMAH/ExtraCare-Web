<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">How ExtraCare keeps a system running</title>
  <desc id="d">Your live system is watched and updated, backed up every day to a safe copy in a separate place, can be restored from any saved copy, and is moved to stronger hosting when more people use it.</desc>
  <defs>
    <style>
      .h{font:700 22px Arial,Helvetica,sans-serif;fill:#f4f0e6}
      .s{font:400 15px Arial,Helvetica,sans-serif;fill:#b4c3b9}
      .k{font:700 13px Arial,Helvetica,sans-serif;fill:#09160f;letter-spacing:.06em}
      .m{font:700 14px Arial,Helvetica,sans-serif;fill:#f4f0e6}
      .card{fill:#0d2a20;stroke:rgba(244,240,230,.16);stroke-width:1.5}
      .ln{stroke:#d8ff3e;stroke-width:3;fill:none;stroke-linecap:round}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d8ff3e"/></marker>
  </defs>
  <rect width="960" height="520" rx="28" fill="#071f17"/>

  <!-- live system -->
  <rect class="card" x="40" y="60" width="260" height="300" rx="22"/>
  <rect x="64" y="84" width="96" height="28" rx="14" fill="#d8ff3e"/>
  <text class="k" x="80" y="103">● ONLINE</text>
  <text class="h" x="64" y="150">Your live system</text>
  <text class="s" x="64" y="176">Website, app or school portal</text>
  <g transform="translate(64 200)">
    <rect width="212" height="40" rx="10" fill="#123629"/><circle cx="20" cy="20" r="6" fill="#d8ff3e"/><rect x="38" y="15" width="120" height="10" rx="5" fill="#2c4a3d"/>
    <rect y="52" width="212" height="40" rx="10" fill="#123629"/><circle cx="20" cy="72" r="6" fill="#d8ff3e"/><rect x="38" y="67" width="96" height="10" rx="5" fill="#2c4a3d"/>
    <rect y="104" width="212" height="40" rx="10" fill="#123629"/><circle cx="20" cy="124" r="6" fill="#d8ff3e"/><rect x="38" y="119" width="140" height="10" rx="5" fill="#2c4a3d"/>
  </g>

  <!-- arrow to backups -->
  <path class="ln" d="M312 170 H392" marker-end="url(#a)"/>
  <text class="m" x="318" y="156">Every day</text>

  <!-- backups -->
  <rect class="card" x="410" y="60" width="250" height="300" rx="22"/>
  <text class="h" x="434" y="104">Backups</text>
  <text class="s" x="434" y="130">Kept in a separate, safe place</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="434" y="156" width="202" height="46" rx="12" fill="#123629"/>
    <rect x="434" y="214" width="202" height="46" rx="12" fill="#123629"/>
    <rect x="434" y="272" width="202" height="46" rx="12" fill="#d8ff3e"/>
  </g>
  <g fill="none" stroke-width="2.2"><ellipse cx="460" cy="172" rx="12" ry="5" stroke="#b4c3b9"/><path d="M448 172v14c0 3 5 5 12 5s12-2 12-5v-14" stroke="#b4c3b9"/>
  <ellipse cx="460" cy="230" rx="12" ry="5" stroke="#b4c3b9"/><path d="M448 230v14c0 3 5 5 12 5s12-2 12-5v-14" stroke="#b4c3b9"/>
  <ellipse cx="460" cy="288" rx="12" ry="5" stroke="#09160f"/><path d="M448 288v14c0 3 5 5 12 5s12-2 12-5v-14" stroke="#09160f"/></g>
  <text class="m" x="484" y="184">Two days ago</text>
  <text class="m" x="484" y="242">Yesterday</text>
  <text class="k" x="484" y="300" style="font-size:14px;letter-spacing:0">Today</text><path d="M538 294l5 5 9-10" stroke="#09160f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- restore arrow back -->
  <path class="ln" d="M535 372 C535 440 170 440 170 372" marker-end="url(#a)" stroke-dasharray="2 9"/>
  <text class="m" x="268" y="462">Something goes wrong? We restore a saved copy.</text>

  <!-- arrow to care -->
  <path class="ln" d="M672 170 H752" marker-end="url(#a)"/>

  <!-- care -->
  <rect class="card" x="770" y="60" width="150" height="300" rx="22"/>
  <text class="h" x="790" y="104">Care</text>
  <g class="s" style="fill:#f4f0e6">
    <path d="M790 144l5 5 9-10" stroke="#d8ff3e" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="812" y="150">Watched</text>
    <path d="M790 184l5 5 9-10" stroke="#d8ff3e" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="812" y="190">Updated</text>
    <path d="M790 224l5 5 9-10" stroke="#d8ff3e" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="812" y="230">Fixed</text>
    <path d="M790 264l5 5 9-10" stroke="#d8ff3e" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="812" y="270">Upgraded</text>
    <path d="M790 304l5 5 9-10" stroke="#d8ff3e" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="812" y="310">Scaled</text>
  </g>
</svg>
