<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1498.0" role="img" aria-labelledby="t"><title id="t">Three example app screens: a maize field with costs and harvest date, a catfish pond with feeding and water checks, and a layer house with eggs and a vaccination reminder. Works offline with SMS and WhatsApp alerts.</title><rect x="0" y="0" width="520" height="1498.0" rx="28" fill="#0d2a20" /><g transform="translate(71.0 20.0) scale(1.4) translate(-40 -46)"><rect x="40" y="46" width="270" height="300" rx="18" fill="#f4f0e6" /><text x="62" y="82" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#0b5a3a" text-anchor="start">CROPS</text><text x="62" y="112" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#1d2b25" text-anchor="start">Field B · Maize</text><text x="62" y="152" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6b64" text-anchor="start">Size</text><text x="288" y="152" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d2b25" text-anchor="end">2 hectares</text><path d="M62 166H288" stroke="#d9d4c6" stroke-width="1.5"/><text x="62" y="194" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6b64" text-anchor="start">Spent so far</text><text x="288" y="194" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d2b25" text-anchor="end">₦335,000</text><path d="M62 208H288" stroke="#d9d4c6" stroke-width="1.5"/><text x="62" y="236" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6b64" text-anchor="start">Next job</text><text x="288" y="236" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d2b25" text-anchor="end">Weeding, Mon</text><path d="M62 250H288" stroke="#d9d4c6" stroke-width="1.5"/><rect x="62" y="296" width="226" height="34" rx="17.0" fill="#0b5a3a" /><text x="175.0" y="319.3333333333333" font-fa