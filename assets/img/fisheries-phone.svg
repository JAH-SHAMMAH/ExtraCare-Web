<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 766" role="img" aria-labelledby="t"><title id="t">Example fish farm screens: a catfish pond water check with oxygen, pH and temperature OK and ammonia high, leading to an alert that tells the farmer to change about a third of the water and feed less, sent by SMS to the farm manager.</title><rect x="0" y="0" width="520" height="766" rx="28" fill="#0d2a20" /><g transform="translate(-30.0 -20)"><rect x="50" y="40" width="480" height="360" rx="18" fill="#f4f0e6" /><text x="78" y="84" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#1d2b25" text-anchor="start">Pond 3 · Catfish</text><text x="78" y="112" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#5c6b64" text-anchor="start">2,000 stocked · day 74 · water check today</text><rect x="78" y="128" width="424" height="46" rx="12" fill="#ffffff" stroke="#ddd6c6"/><text x="98" y="158" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1d2b25" text-anchor="start">Oxygen</text><text x="330" y="158" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#1d2b25" text-anchor="end">5.2 mg/L</text><rect x="354" y="136" width="128" height="30" rx="15.0" fill="#2f9e6a" /><text x="418.0" y="157.0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">OK</text><rect x="78" y="181" width="424" height="46" rx="12" fill="#ffffff" stroke="#ddd6c6"/><text x="98" y="211" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1d2b25" text-anchor="start">pH</text><text x="330" y="211" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#1d2b25" text-anchor="end">7.1</text><rect x="354" y="189" width="128" height="30" rx="15.0" fill="#2f9e6a" /><text x="418.0" y="210.0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">OK</text><rect x="78" y="234" width="424" height="46" rx="12" fill="#fbe9d0" stroke="#ddd6c6"/><text x="98" y="264" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1d2b25" text-anchor="start">Ammonia</text><text x="330" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#1d2b25" text-anchor="end">0.8 mg/L</text><rect x="354" y="242" width="128" height="30" rx="15.0" fill="#c98a12" /><text x="418.0" y="263.0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">High</text><rect x="78" y="287" width="424" height="46" rx="12" fill="#ffffff" stroke="#ddd6c6"/><text x="98" y="317" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1d2b25" text-anchor="start">Temperature</text><text x="330" y="317" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#1d2b25" text-anchor="end">28 °C</text><rect x="354" y="295" width="128" height="30" rx="15.0" fill="#2f9e6a" /><text x="418.0" y="316.0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">OK</text><text x="78" y="372" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#5c6b64" text-anchor="start">Feed today 18 kg  ·  Deaths 3</text></g><path d="M260.0 394V426" stroke="#d8ff3e" stroke-width="4" stroke-linecap="round"/><path d="M250.0 424l10 14 10-14z" fill="#d8ff3e"/><g transform="translate(-505.0 376)"><rect x="610" y="70" width="310" height="300" rx="18" fill="#123629" stroke="rgba(244,240,230,.16)" stroke-width="2"/><circle cx="765" cy="128" r="30" fill="#c98a12"/><path d="M765 112v20" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="765" cy="143" r="3.5" fill="#fff"/><text x="765" y="194" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#f4f0e6" text-anchor="middle">Ammonia is high in Pond 3</text><text x="765" y="232" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#b4c3b9" text-anchor="middle">Change about a third of</text><text x="765" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#b4c3b9" text-anchor="middle">the water and feed less today.</text><rect x="660" y="296" width="210" height="36" rx="18.0" fill="#0b5a3a" /><text x="765.0" y="320.0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">SMS sent to manager</text></g></svg>