<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 786" role="img" aria-labelledby="t"><title id="t">Example crop farm screens: a maize field record listing ploughing, planting, fertiliser and weeding with costs and a total of 335,000 naira, then store and sales showing 38 bags in store, a moisture check due, 20 bags sold and paid, and 18 bags left.</title><rect x="0" y="0" width="520" height="786" rx="28" fill="#0d2a20" /><g transform="translate(-25.0 -20)"><rect x="50" y="40" width="470" height="360" rx="18" fill="#f4f0e6" /><text x="78" y="84" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#1d2b25" text-anchor="start">Field B · Maize, 2 ha</text><text x="78" y="112" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#5c6b64" text-anchor="start">Season costs, step by step</text><circle cx="92" cy="146" r="11" fill="#2f9e6a"/><path d="M87 146l3.5 3.5 6.5-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="152" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1d2b25" text-anchor="start">Ploughing</text><text x="492" y="152" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d2b25" text-anchor="end">₦60,000</text><circle cx="92" cy="192" r="11" fill="#2f9e6a"/><path d="M87 192l3.5 3.5 6.5-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="198" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1d2b25" text-anchor="start">Seed and planting</text><text x="492" y="198" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d2b25" text-anchor="end">₦95,000</text><circle cx="92" cy="238" r="11" fill="#2f9e6a"/><path d="M87 238l3.5 3.5 6.5-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="244" font-family=